name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest
      - name: Validate config
        run: uv run peptide-watch config check
      - name: Language gate
        run: uv run python tools/check_language.py
