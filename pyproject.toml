[project]
name = "peptide-watch"
version = "0.1.0"
description = "Compliance-safe public-source peptide catalyst tracker"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "pydantic>=2",
  "pyyaml>=6",
  "httpx>=0.27",
  "tenacity>=8",
  "beautifulsoup4>=4",
  "feedparser>=6",
  "python-dateutil>=2",
  "pypdf>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
peptide-watch = "peptide_watch.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/peptide_watch"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
